[package]
name = "loco-kit-credentials"
version = "0.1.0"
description = "Encrypted credentials files for Loco apps, like Rails' credentials.yml.enc, with a `cargo loco credentials` command."
readme = "README.md"
keywords = ["loco", "credentials", "secrets", "encryption", "config"]
categories = ["web-programming", "config", "cryptography"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
loco-rs = { workspace = true }
serde = { version = "1" }
serde_json = { version = "1" }
aes-gcm = { version = "0.11" }
base64 = { version = "0.23" }
hex = { version = "0.4" }
tempfile = { version = "3" }
clap = { version = "4", features = ["derive"] }
# Same YAML crate (and version) Loco parses config with.
serde_yaml_ng = { version = "0.10" }
