[package]
name = "loco-kit-local-storage"
version = "0.1.0"
edition = "2021"
publish = false

# `ctx.storage` on the local disk or in memory, from an `initializers.storage`
# config block, plus sharded storage keys and a `cargo loco doctor` check.
# App-agnostic: it depends on Loco, never on the app. S3 needs no kit: use
# Loco's own `storage_aws_s3` driver.

[dependencies]
loco-rs = { workspace = true }
async-trait = { version = "0.1" }
bytes = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
tempfile = { version = "3" }
tokio = { version = "1", features = ["macros", "rt"] }
