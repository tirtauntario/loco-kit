[package]
name = "loco-kit-local-storage"
version = "0.1.0"
description = "Local-disk and in-memory `ctx.storage` for Loco apps, configured from YAML, with sharded storage keys."
readme = "README.md"
keywords = ["loco", "storage", "filesystem", "uploads"]
categories = ["web-programming", "filesystem"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
loco-rs = { workspace = true }
async-trait = { version = "0.1" }
bytes = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
tempfile = { version = "3" }
tokio = { version = "1", features = ["macros", "rt"] }
