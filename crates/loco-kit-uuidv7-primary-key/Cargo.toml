[package]
name = "loco-kit-uuidv7-primary-key"
version = "0.1.0"
edition = "2021"
publish = false

# UUID v7 primary keys for Loco models on Postgres, SQLite and MySQL: ids
# are made in Rust on insert, and the migration helpers type foreign keys as
# UUIDs. App-agnostic: it depends on Loco, never on the app.

[dependencies]
loco-rs = { workspace = true }
sea-orm = { version = "2.0" }
sea-orm-migration = { version = "2.0" }
uuid = { version = "1.6", features = ["v7"] }
# Same inflector Loco names tables and `<table>_id` columns with.
cruet = { version = "1.0" }
heck = { version = "0.5" }

[dev-dependencies]
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
async-trait = { version = "0.1" }
tokio = { version = "1", features = ["macros", "rt"] }
