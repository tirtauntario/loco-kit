[package]
name = "loco-kit-uuidv7-primary-key"
version = "0.2.0"
description = "UUID v7 primary keys for Loco models and migrations on Postgres, SQLite and MySQL."
readme = "README.md"
keywords = ["loco", "uuid", "uuidv7", "sea-orm", "primary-key"]
categories = ["web-programming", "database"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# The generator templates are copied from GitHub, not used from the package.
exclude = ["templates/"]

[dependencies]
loco-rs = { workspace = true }
sea-orm = { version = "2.0" }
sea-orm-migration = { version = "2.0" }
uuid = { version = "1.6", features = ["v7"] }
# Same inflector Loco names tables and `<table>_id` columns with.
cruet = { version = "1.0" }
heck = { version = "0.5" }

[dev-dependencies]
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
async-trait = { version = "0.1" }
tokio = { version = "1", features = ["macros", "rt"] }
