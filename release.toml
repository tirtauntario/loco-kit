# cargo-release (https://github.com/crate-ci/cargo-release). Each crate is
# released on its own: `cargo release patch -p loco-kit-credentials --execute`
# bumps its version, rolls its CHANGELOG.md, commits, tags
# `loco-kit-credentials-v0.1.1` and pushes.
tag-name = "{{crate_name}}-v{{version}}"
# Git tags only until the APIs settle; drop this line to publish to crates.io.
publish = false

# Moves the `## [Unreleased]` entries of the released crate's CHANGELOG.md
# under a new version heading, and updates the compare links at the bottom.
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "\\[Unreleased\\]: .*", replace = "[Unreleased]: https://github.com/tirtauntario/loco-kit/compare/{{tag_name}}...HEAD\n[{{version}}]: https://github.com/tirtauntario/loco-kit/compare/{{crate_name}}-v{{prev_version}}...{{tag_name}}", exactly = 1 },
]
